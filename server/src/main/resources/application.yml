server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/aiagent;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# API Key encryption secret (used for AES encryption of provider API keys)
aiagent:
  encryption:
    secret: ai-agent-default-secret-key-32b!
